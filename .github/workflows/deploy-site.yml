name: Deploy site

# Deploys the landing site at https://kcp.cecs.sh/ (ADR-0066, ADR-0080). The release
# workflow calls it with the released commit when a version is tagged. A dispatch from
# main with a released tag deploys that tag again, which is also how a deploy rolls back.
# The build job installs and runs the repository's code without any Cloudflare secret.
# The deploy job runs in the cloudflare-production environment, which waits for the
# owner's approval, runs no package the build job installed, and publishes the committed
# site/ from the checked commit rather than any file the build job wrote, so no dependency
# script runs while the token is in scope and none can change what is published.

on:
  workflow_call:
    inputs:
      ref:
        description: Full SHA of the released commit
        required: true
        type: string
    # A called workflow sees an environment secret only when the caller passes it, even
    # in a job that names the environment; without it the token is an empty string.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to deploy, such as v1.7.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      # A call passes a commit SHA and a dispatch a tag. Both arrive through env and are
      # matched as whole strings before anything uses them.
      - id: ref
        name: Check the ref to deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALL_REF: ${{ inputs.ref }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            if [[ ! "$DISPATCH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::the tag must be a release tag such as v1.7.2"
              exit 1
            fi
            echo "ref=refs/tags/${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$CALL_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::the ref must be a full commit SHA"
              exit 1
            fi
            echo "ref=${CALL_REF}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      # The deploy job checks out this exact commit, so a tag moved while the deploy waits
      # for approval changes nothing.
      - id: commit
        name: Record the commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same check as the quality job in ci.yml, written out here because a rollback
      # checks out a tag that may predate any shared script.
      - name: Check the committed landing site is current
        run: |
          pnpm site:build
          changed="$(git status --porcelain -- site)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::site/ differs from what pnpm site:build renders"
            exit 1
          fi
      # Validates the configuration and reads the assets without a token. For a
      # configuration with assets alone the output is only the no op Worker that Wrangler
      # generates again at deploy, so it is not kept.
      - name: Dry run the deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/wrangler-dry"

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://kcp.cecs.sh/
    permissions:
      contents: read
    # One deploy at a time. A running deploy is never cancelled. A newer one waits, and
    # one newer still takes the place of the one waiting.
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    steps:
      # The configuration and the pages come from the commit the build job checked, never
      # from anything the build job wrote, so a package it ran can neither add a build
      # command that would run beside the token nor change what is published. site/ is
      # committed and the build job proved it current, so these are the reviewed bytes.
      # The manifest and the lockfile come with them for the install below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            /wrangler.jsonc
            /site/
            /package.json
            /pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache here: a cache saved by a job that ran dependency code could
      # hold altered files, while a fresh install checks every package against its
      # integrity hash in the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The frozen install resolves the whole tree, Wrangler and every package it loads,
      # from the lockfile entries and their hashes, with lifecycle scripts disabled. Only
      # Wrangler runs afterwards, and nothing from the build job is present.
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: ./node_modules/.bin/wrangler deploy
