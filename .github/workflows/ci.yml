name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The release deploy publishes the committed site/ as it is, so main must never hold
      # pages older than their sources. The build needs no extension build and no
      # browser, only the sources and the encoded images already in the repository.
      - name: Check the committed landing site is current
        run: |
          pnpm site:build
          changed="$(git status --porcelain -- site)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::site/ differs from what pnpm site:build renders; run it and commit the result"
            exit 1
          fi

  commit-check:
    name: commit-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enforce commit message policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format='%B' "$sha" > commit-message.txt
            if ! node scripts/commit-msg-guard.mjs commit-message.txt; then
              echo "::error::commit ${sha} violates the message policy"
              status=1
            fi
          done
          rm -f commit-message.txt
          exit $status
      - name: Enforce pull request description policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "${PR_BODY}" > "${RUNNER_TEMP}/pr-body.txt"
          node scripts/commit-msg-guard.mjs --pr-body "${RUNNER_TEMP}/pr-body.txt"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wxt build -b ${{ matrix.browser }}
      # Warnings fail the step, since an Android unsupported manifest key is only
      # a warning. The two rules the bundled third party code trips are off and
      # ESLint enforces them on the project source (ADR-0070).
      - name: Lint the Firefox bundle with addons-linter
        if: matrix.browser == 'firefox'
        run: pnpm lint:firefox
      - run: pnpm wxt zip -b ${{ matrix.browser }}
      # Growth past the budget in scripts/bundle-budget.mjs fails the build, so a
      # larger package is a decision made in review rather than drift.
      - name: Check the packed size against its budget
        run: node scripts/check-bundle-size.mjs ${{ matrix.browser }}
      - name: Canary check on production bundle
        run: |
          if grep -rIl 'kcp-debug-canary' .output/; then
            echo "::error::debug canary found in production bundle"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: extension-${{ matrix.browser }}-${{ github.sha }}
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dot directory, whose contents upload-artifact treats as
          # hidden and skips unless this is set.
          include-hidden-files: true

  debug-build:
    name: debug-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:debug -b chrome
      - name: Assert debug bundle retains the diagnostic canary
        run: |
          if grep -rIl 'kcp-debug-canary' .output/; then
            echo "debug canary present as expected"
          else
            echo "::error::debug canary missing from debug bundle"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: extension-chrome-debug-${{ github.sha }}
          path: .output/
          if-no-files-found: error
          include-hidden-files: true

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  osv-scan:
    name: osv-scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --lockfile=./pnpm-lock.yaml

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The e2e specs load both flavors: production for the isolation checks and
      # debug for the browser driven specs. WXT suffixes the debug output dir, so
      # the two builds coexist. The Firefox production build is only read by the
      # manifest smoke spec, which checks its Android declaration.
      - run: pnpm wxt build -b chrome
      - run: pnpm build:debug -b chrome
      - run: pnpm wxt build -b firefox
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          retention-days: 14
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
